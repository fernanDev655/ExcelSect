<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Sect - Equipo Profesional de Rocket League</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --black: #08080a;
            --surface: #17171b;
            --line: rgba(255,255,255,0.10);
            --gold: #c9a13b;
            --gold-bright: #e6bf5c;
            --ink: #f4f3ef;
            --ink-dim: #9a999e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--black);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }
        .brand-font { font-family: 'Oswald', sans-serif; }

        /* Top + bottom broadcast-style rules, framing the screen */
        .frame-rule {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 5vw;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-dim);
            border-bottom: 1px solid var(--line);
        }

        .frame-rule.bottom {
            border-bottom: none;
            border-top: 1px solid var(--line);
        }

        .frame-rule span.gold { color: var(--gold); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6vh 5vw;
        }

        .content {
            text-align: center;
            max-width: 720px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 28px;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: '';
            width: 20px;
            height: 1px;
            background: var(--gold);
        }

        .wordmark {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 9vw, 6.5rem);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--ink);
        }

        .wordmark .accent { color: var(--gold-bright); }

        .tagline {
            margin-top: 20px;
            font-size: 1.05rem;
            color: var(--ink-dim);
            letter-spacing: 0.02em;
        }

        .actions {
            margin-top: 48px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #0c0c0e;
            background: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .enter-btn:hover {
            background: var(--gold-bright);
            transform: translateY(-1px);
        }

        .enter-btn i { transition: transform 0.2s ease; }
        .enter-btn:hover i { transform: translateX(3px); }

        /* Signature scoreboard strip */
        .scoreboard {
            margin-top: 56px;
            display: flex;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .scoreboard-cell {
            flex: 1;
            padding: 18px 20px;
            position: relative;
        }

        .scoreboard-cell + .scoreboard-cell::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 1px;
            background: var(--line);
        }

        .scoreboard-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            color: var(--gold-bright);
        }

        .scoreboard-label {
            margin-top: 6px;
            font-size: 10.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        @media (max-width: 640px) {
            .frame-rule { font-size: 10px; padding: 18px 6vw; }
            .scoreboard-value { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="frame-rule">
        <span>EXCEL SECT</span>
        <span class="gold">ROCKET LEAGUE &middot; REGIÓN EU</span>
    </div>

    <main>
        <div class="content">
            <div class="eyebrow">Equipo profesional</div>

            <h1 class="wordmark">EXCEL<span class="accent">SECT</span></h1>

            <p class="tagline">Domina el campo. Eleva tu juego. Únete a la élite de Rocket League.</p>

            <div class="actions">
                <a href="ExcelSet.html" class="enter-btn">
                    Entrar al sitio
                    <i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <div class="scoreboard">
                <div class="scoreboard-cell">
                    <div class="scoreboard-value">12</div>
                    <div class="scoreboard-label">Jugadores</div>
                </div>
                <div class="scoreboard-cell">
                    <div class="scoreboard-value">D3+</div>
                    <div class="scoreboard-label">Rango mínimo</div>
                </div>
                <div class="scoreboard-cell">
                    <div class="scoreboard-value">EU</div>
                    <div class="scoreboard-label">Región</div>
                </div>
            </div>
        </div>
    </main>

    <div class="frame-rule bottom">
        <span>V 2.0.26</span>
        <span>ESPORTS</span>
    </div>

</body>
</html>
